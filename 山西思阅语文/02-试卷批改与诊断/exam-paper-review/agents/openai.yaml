interface:
  display_name: "试卷点评批改"
  short_description: "按评分标准给学生试卷评分、批注扣分原因并导出分享 PDF。"
  default_prompt: "请按低负载模式点评待点评学生试卷：一次只处理一个学生或1-2页，已有红笔/分数则只解释扣分原因、不默认重评；如果答题卡没有可见打分，则按评分标准评分，并给每一个题目单独添加得分标注，格式如“3题 2/4分”。得分标注和评语必须分开放置，不能合并在同一个框里；得分标注使用和评语一致的淡黄色透明红框风格，但要更小更简洁。版式上，评语统一放在每个题目对应区域的右边边缘，并尽量保持上下评语边缘对齐，形成整洁的评语列；得分标注可放在题号旁边或左右边缘，也要尽量上下对齐成整洁的分数列。以 skill 内置 assets/standard-sample.png 作为统一批注风格，整页答题卡保持原始版式，只叠加小号淡黄色透明红框批注，背景使用样例图那种浅淡黄色，不要做成高饱和荧光黄；框体少遮挡正文，但评语必须完整清晰，正文用深红棕色高对比显示，不能太浅，1800px宽扫描图上正文约20-24px且不得低于18px；每条评语使用完整的“错因：...”和“修正：...”，必须指出具体缺失/错误角度，并给出可执行的修正方法，不要截断、省略号或泛泛而谈。生成的批注图片和PDF只保存为本地文件并返回路径，不要把整页图片、高清预览或base64内容内联到对话里。PDF生成前可以做必要视觉检查；PDF生成后只做文件检查，确认存在、大小合理、页数无误即可交付，不要再做视觉复查或二次修补。生成PDF时同步写一个同目录的“_完成路径.txt”记录PDF绝对路径，防止聊天输出失败。最终回复必须极简纯文本，只输出PDF绝对路径和必要备注，不要附图、不要Markdown图片、不要长总结、不要预览。如果无法按样例风格执行，或需要拆页、侧栏、重排、远距离放置批注、批量处理或重新评分，请先说明原因和建议调整形式，等我确认后再继续。"
